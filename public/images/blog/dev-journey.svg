<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="deskLight" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18242c" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0b1116" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05080a" stop-opacity="1"/>
    </radialGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#14ffc5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Desk Surface -->
  <rect width="800" height="500" fill="url(#deskLight)"/>

  <!-- Plant on the left -->
  <g transform="translate(60, 160)">
    <!-- Pot -->
    <path d="M 25 150 L 105 150 L 95 240 L 35 240 Z" fill="#1b2229" stroke="#334155" stroke-width="2"/>
    <!-- Succulent Leaves -->
    <path d="M 65 150 C 40 100 20 120 10 140 C 25 145 45 150 65 150 Z" fill="#10b981"/>
    <path d="M 65 150 C 30 70 60 50 65 70 C 70 100 70 130 65 150 Z" fill="#059669"/>
    <path d="M 65 150 C 90 100 110 120 120 140 C 105 145 85 150 65 150 Z" fill="#34d399"/>
    <path d="M 65 150 C 50 110 70 90 80 110 C 75 130 70 140 65 150 Z" fill="#6ee7b7"/>
  </g>

  <!-- Laptop in the Center with "Keep Learning" -->
  <g transform="translate(230, 80)" filter="url(#cardGlow)">
    <!-- Laptop screen outer frame -->
    <rect width="340" height="230" rx="14" fill="#0b1016" stroke="#334155" stroke-width="2"/>
    <!-- Screen display area -->
    <rect x="12" y="12" width="316" height="206" rx="8" fill="#05080c" filter="url(#screenGlow)"/>
    
    <!-- "Keep Learning" text -->
    <text x="170" y="100" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="1">Keep</text>
    <text x="170" y="140" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="1">Learning</text>

    <!-- Laptop Base -->
    <path d="M -20 230 L 360 230 L 340 242 L -0 242 Z" fill="#1a232e" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Open Notebook in Front -->
  <g transform="translate(210, 335)" filter="url(#cardGlow)">
    <!-- Left page -->
    <path d="M 20 0 L 190 10 L 190 120 L 15 110 Z" fill="#f1f5f9"/>
    <!-- Right page -->
    <path d="M 190 10 L 360 0 L 365 110 L 190 120 Z" fill="#e2e8f0"/>
    <!-- Spine binding -->
    <line x1="190" y1="10" x2="190" y2="120" stroke="#94a3b8" stroke-width="3"/>
    <!-- Ruled lines -->
    <line x1="40" y1="30" x2="170" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="55" x2="170" y2="61" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="80" x2="170" y2="86" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <line x1="210" y1="36" x2="340" y2="30" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="210" y1="61" x2="340" y2="55" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="210" y1="86" x2="340" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Pen lying across -->
    <line x1="310" y1="20" x2="380" y2="90" stroke="#14ffc5" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Coffee Cup on the Right -->
  <g transform="translate(630, 200)" filter="url(#cardGlow)">
    <!-- Saucer -->
    <ellipse cx="60" cy="110" rx="55" ry="18" fill="#1e293b"/>
    <!-- Cup body -->
    <path d="M 25 50 L 95 50 C 95 95 25 95 25 50 Z" fill="#ffffff"/>
    <ellipse cx="60" cy="50" rx="35" ry="12" fill="#e2e8f0"/>
    <!-- Coffee liquid -->
    <ellipse cx="60" cy="52" rx="30" ry="9" fill="#3e2723"/>
    <!-- Handle -->
    <path d="M 90 55 C 115 55 115 85 90 85" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
