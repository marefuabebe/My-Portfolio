<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="deskGlow" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#142633" stop-opacity="1"/>
      <stop offset="50%" stop-color="#081017" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04070a" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#deskGlow)"/>

  <!-- Glowing cyan back-strip -->
  <line x1="80" y1="90" x2="720" y2="90" stroke="#14ffc5" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round"/>

  <!-- Laptop with Code Editor (Left/Center) -->
  <g transform="translate(100, 70)" filter="url(#shadowHeavy)">
    <!-- Screen frame -->
    <rect width="450" height="290" rx="14" fill="#0c1218" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="12" y="12" width="426" height="266" rx="8" fill="#080c10"/>

    <!-- IDE Titlebar -->
    <rect x="12" y="12" width="426" height="32" rx="8" fill="#0e1520"/>
    <rect x="12" y="30" width="426" height="14" fill="#0e1520"/>
    <circle cx="32" cy="28" r="4.5" fill="#ff5f56"/>
    <circle cx="48" cy="28" r="4.5" fill="#ffbd2e"/>
    <circle cx="64" cy="28" r="4.5" fill="#27c93f"/>
    <text x="88" y="32" fill="#94a3b8" font-family="monospace" font-size="11">tools.config.js - Developer Arsenal</text>

    <!-- Sidebar in IDE -->
    <rect x="12" y="44" width="70" height="234" fill="#0a0f16"/>
    <line x1="82" y1="44" x2="82" y2="278" stroke="#1e293b" stroke-width="1"/>
    <!-- File tree bars -->
    <rect x="22" y="58" width="42" height="6" rx="2" fill="#334155"/>
    <rect x="26" y="74" width="36" height="5" rx="2" fill="#14ffc5" fill-opacity="0.6"/>
    <rect x="26" y="88" width="40" height="5" rx="2" fill="#475569"/>
    <rect x="26" y="102" width="32" height="5" rx="2" fill="#475569"/>

    <!-- Code text in editor -->
    <g font-family="monospace" font-size="11.5" font-weight="500">
      <text x="100" y="75" fill="#c084fc">export const</text>
      <text x="195" y="75" fill="#14ffc5">devtools</text>
      <text x="260" y="75" fill="#38bdf8">=</text>
      <text x="275" y="75" fill="#ffffff">[</text>

      <text x="120" y="102" fill="#fbbf24">{</text>
      <text x="135" y="102" fill="#f8fafc">name:</text>
      <text x="180" y="102" fill="#4ade80">"VS Code"</text>
      <text x="255" y="102" fill="#94a3b8">,</text>
      <text x="270" y="102" fill="#f8fafc">category:</text>
      <text x="345" y="102" fill="#4ade80">"IDE"</text>
      <text x="390" y="102" fill="#fbbf24">},</text>

      <text x="120" y="130" fill="#fbbf24">{</text>
      <text x="135" y="130" fill="#f8fafc">name:</text>
      <text x="180" y="130" fill="#4ade80">"Docker"</text>
      <text x="245" y="130" fill="#94a3b8">,</text>
      <text x="260" y="130" fill="#f8fafc">category:</text>
      <text x="335" y="130" fill="#4ade80">"DevOps"</text>
      <text x="395" y="130" fill="#fbbf24">},</text>

      <text x="120" y="158" fill="#fbbf24">{</text>
      <text x="135" y="158" fill="#f8fafc">name:</text>
      <text x="180" y="158" fill="#4ade80">"Postman"</text>
      <text x="250" y="158" fill="#94a3b8">,</text>
      <text x="265" y="158" fill="#f8fafc">category:</text>
      <text x="340" y="158" fill="#4ade80">"API"</text>
      <text x="380" y="158" fill="#fbbf24">},</text>

      <text x="120" y="186" fill="#fbbf24">{</text>
      <text x="135" y="186" fill="#f8fafc">name:</text>
      <text x="180" y="186" fill="#4ade80">"Git"</text>
      <text x="225" y="186" fill="#94a3b8">,</text>
      <text x="240" y="186" fill="#f8fafc">category:</text>
      <text x="315" y="186" fill="#4ade80">"VCS"</text>
      <text x="360" y="186" fill="#fbbf24">}</text>

      <text x="100" y="214" fill="#ffffff">];</text>

      <!-- Terminal output at bottom -->
      <rect x="94" y="230" width="330" height="38" rx="4" fill="#040608"/>
      <text x="106" y="254" fill="#14ffc5" font-size="10.5">➜ devtools: 4/4 online and operational</text>
    </g>

    <!-- Laptop Base -->
    <path d="M -30 290 L 480 290 L 450 306 L -0 306 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Smartphone on Right showing Mobile Companion Dashboard -->
  <g transform="translate(600, 160)" filter="url(#shadowHeavy)">
    <!-- Phone frame -->
    <rect width="130" height="240" rx="20" fill="#0c1218" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Phone screen -->
    <rect x="6" y="6" width="118" height="228" rx="16" fill="#05080c"/>
    <!-- Dynamic island notch -->
    <rect x="42" y="12" width="46" height="8" rx="4" fill="#000000"/>
    
    <!-- App UI on phone -->
    <text x="16" y="44" fill="#14ffc5" font-family="system-ui" font-size="9" font-weight="700">TOOLS METRICS</text>
    <rect x="16" y="54" width="98" height="38" rx="6" fill="#0d1822"/>
    <text x="24" y="72" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="800">99.8%</text>
    <text x="24" y="84" fill="#94a3b8" font-family="system-ui" font-size="7">System Uptime</text>

    <!-- Mini chart -->
    <path d="M 16 130 L 35 120 L 55 125 L 75 105 L 95 115 L 114 95" fill="none" stroke="#14ffc5" stroke-width="2.5"/>
    <rect x="16" y="150" width="98" height="18" rx="4" fill="#0d1822"/>
    <rect x="16" y="174" width="98" height="18" rx="4" fill="#0d1822"/>
    <rect x="16" y="198" width="98" height="18" rx="4" fill="#0d1822"/>
  </g>
</svg>
