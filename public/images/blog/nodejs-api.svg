<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e3a35" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#061219" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04090d" stop-opacity="1"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Code Editor Panel (Left) -->
  <g transform="translate(60, 50)">
    <!-- Terminal window container -->
    <rect width="400" height="390" rx="16" fill="#090f15" stroke="#14ffc5" stroke-opacity="0.18" stroke-width="1.5"/>
    
    <!-- Header bar -->
    <rect width="400" height="38" rx="16" fill="#0f1722"/>
    <rect y="22" width="400" height="16" fill="#0f1722"/>
    <line x1="0" y1="38" x2="400" y2="38" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="19" r="5" fill="#27c93f"/>
    <text x="82" y="23" fill="#64748b" font-family="monospace" font-size="12">server.js - Node.js API</text>

    <!-- Code lines representation -->
    <g font-family="monospace" font-size="13" font-weight="500">
      <!-- Line 1 -->
      <text x="25" y="75" fill="#475569">01</text>
      <text x="60" y="75" fill="#c084fc">import</text>
      <text x="115" y="75" fill="#f8fafc">express</text>
      <text x="180" y="75" fill="#c084fc">from</text>
      <text x="220" y="75" fill="#4ade80">"express"</text>
      <text x="290" y="75" fill="#94a3b8">;</text>

      <!-- Line 2 -->
      <text x="25" y="105" fill="#475569">02</text>
      <text x="60" y="105" fill="#c084fc">import</text>
      <text x="115" y="105" fill="#f8fafc">{ connectDB }</text>
      <text x="225" y="105" fill="#c084fc">from</text>
      <text x="265" y="105" fill="#4ade80">"./db.js"</text>
      <text x="330" y="105" fill="#94a3b8">;</text>

      <!-- Line 3 -->
      <text x="25" y="135" fill="#475569">03</text>
      
      <!-- Line 4 -->
      <text x="25" y="165" fill="#475569">04</text>
      <text x="60" y="165" fill="#38bdf8">const</text>
      <text x="110" y="165" fill="#f8fafc">app</text>
      <text x="140" y="165" fill="#38bdf8">=</text>
      <text x="160" y="165" fill="#fbbf24">express</text>
      <text x="215" y="165" fill="#94a3b8">();</text>

      <!-- Line 5 -->
      <text x="25" y="195" fill="#475569">05</text>
      <text x="60" y="195" fill="#38bdf8">await</text>
      <text x="110" y="195" fill="#14ffc5">connectDB</text>
      <text x="195" y="195" fill="#94a3b8">();</text>

      <!-- Line 6 -->
      <text x="25" y="225" fill="#475569">06</text>
      <text x="60" y="225" fill="#f8fafc">app.</text>
      <text x="90" y="225" fill="#38bdf8">use</text>
      <text x="118" y="225" fill="#94a3b8">(</text>
      <text x="125" y="225" fill="#fbbf24">express.json</text>
      <text x="220" y="225" fill="#94a3b8">());</text>

      <!-- Line 7 -->
      <text x="25" y="255" fill="#475569">07</text>
      
      <!-- Line 8 -->
      <text x="25" y="285" fill="#475569">08</text>
      <text x="60" y="285" fill="#f8fafc">app.</text>
      <text x="90" y="285" fill="#38bdf8">get</text>
      <text x="115" y="285" fill="#94a3b8">(</text>
      <text x="125" y="285" fill="#4ade80">"/api/v1/data"</text>
      <text x="240" y="285" fill="#94a3b8">, (req, res) =&gt; {</text>

      <!-- Line 9 -->
      <text x="25" y="315" fill="#475569">09</text>
      <text x="80" y="315" fill="#f8fafc">res.</text>
      <text x="108" y="315" fill="#38bdf8">json</text>
      <text x="140" y="315" fill="#94a3b8">({ status:</text>
      <text x="220" y="315" fill="#4ade80">"success"</text>
      <text x="290" y="315" fill="#94a3b8">});</text>

      <!-- Line 10 -->
      <text x="25" y="345" fill="#475569">10</text>
      <text x="60" y="345" fill="#94a3b8">});</text>

      <!-- Line 11 -->
      <text x="25" y="375" fill="#475569">11</text>
      <text x="60" y="375" fill="#14ffc5">app.listen</text>
      <text x="145" y="375" fill="#94a3b8">(</text>
      <text x="155" y="375" fill="#fb923c">5000</text>
      <text x="190" y="375" fill="#94a3b8">);</text>
    </g>
  </g>

  <!-- Database Glowing Cylinder Card (Right) -->
  <g transform="translate(500, 130)">
    <!-- Outer Card -->
    <rect width="230" height="230" rx="28" fill="#091419" stroke="#14ffc5" stroke-opacity="0.3" stroke-width="2" filter="url(#softGlow)"/>
    
    <!-- Inner ambient circle -->
    <circle cx="115" cy="115" r="85" fill="#14ffc5" fill-opacity="0.06"/>

    <!-- 3D Database Cylinders in Neon Cyan -->
    <g transform="translate(65, 55)" filter="url(#neonGlow)">
      <!-- Disc 1 (Top) -->
      <ellipse cx="50" cy="25" rx="46" ry="16" fill="none" stroke="#14ffc5" stroke-width="6"/>
      <ellipse cx="50" cy="25" rx="46" ry="16" fill="#09181e"/>

      <!-- Disc 2 (Middle) -->
      <path d="M 4 25 V 60 C 4 72 96 72 96 60 V 25" fill="none" stroke="#14ffc5" stroke-width="6"/>
      <path d="M 4 60 C 4 72 96 72 96 60" fill="none" stroke="#14ffc5" stroke-width="6"/>

      <!-- Disc 3 (Bottom) -->
      <path d="M 4 60 V 95 C 4 107 96 107 96 95 V 60" fill="none" stroke="#14ffc5" stroke-width="6"/>
      <path d="M 4 95 C 4 107 96 107 96 95" fill="none" stroke="#14ffc5" stroke-width="6"/>
    </g>

    <!-- Label -->
    <text x="115" y="195" text-anchor="middle" fill="#14ffc5" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1">REST API DB</text>
  </g>
</svg>
